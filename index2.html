<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Box Bounce</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#151a20;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

.mobile{
    position:fixed;
    display:none;
    z-index:10;
    width:68px;
    height:68px;
    border:2px solid rgba(255,255,255,.25);
    border-radius:15px;
    background:rgba(20,25,31,.85);
    color:#fff;
    font:bold 28px Arial;
    align-items:center;
    justify-content:center;
}

#left{
    left:15px;
    bottom:15px;
}

#right{
    left:95px;
    bottom:15px;
}

#jump{
    right:15px;
    bottom:15px;
}

@media(max-width:800px){
    .mobile{
        display:flex;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="left" class="mobile">◀</div>
<div id="right" class="mobile">▶</div>
<div id="jump" class="mobile">▲</div>

<script>
<script>

/* =========================================================
   BOX BOUNCE
   GRID VERSION
   ========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(devicePixelRatio||1,2);

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    buildGrid();
}

addEventListener("resize",resize);


/* =========================================================
   GRID SETTINGS
   ========================================================= */

const GRID_SIZE=50;

const GROUND_HEIGHT=105;

/*
    How many rows can exist above
    the ground.

    This is the actual height limit.
*/
const MAX_ROWS=7;


/* =========================================================
   WORLD
   ========================================================= */

let GRID_X=0;
let GRID_COLS=0;
let GRID_ROWS=MAX_ROWS;

let groundY=0;

function buildGrid(){

    groundY=H-GROUND_HEIGHT;

    /*
        Center the grid.
    */

    GRID_COLS=
        Math.max(
            3,
            Math.floor(
                W/GRID_SIZE
            )
        );

    GRID_X=
        (W-
        GRID_COLS*
        GRID_SIZE)/2;
}

function cellX(col){

    return GRID_X+
        col*
        GRID_SIZE;
}

function cellY(row){

    /*
        row 0 = ground level
        row 1 = first box
        etc.
    */

    return groundY-
        GRID_SIZE-
        row*
        GRID_SIZE;
}


/* =========================================================
   STATE
   ========================================================= */

let state="menu";

let score=0;

let best=
    Number(
        localStorage.getItem(
            "boxBounceBest"
        )||0
    );

let gameTime=0;

let spawnTimer=1.5;

let carTimer=6;

let shake=0;


/* =========================================================
   ARRAYS
   ========================================================= */

let boxes=[];

let warnings=[];

let items=[];

let boards=[];

let cars=[];

let particles=[];

let floatingTexts=[];


/* =========================================================
   PLAYER
   ========================================================= */

const PLAYER_SIZE=38;

const player={

    x:0,

    y:0,

    w:PLAYER_SIZE,

    h:PLAYER_SIZE,

    vx:0,

    vy:0,

    grounded:false,

    gridCol:-1,

    item:null,

    shieldTime:0,

    dead:false
};


/* =========================================================
   PHYSICS
   ========================================================= */

const GRAVITY=.65;

const MOVE_SPEED=5.5;

const JUMP_POWER=12.5;


/* =========================================================
   INPUT
   ========================================================= */

const keys={};

let leftPressed=false;
let rightPressed=false;

addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    keys[key]=true;

    if(
        key==="arrowleft" ||
        key==="arrowright" ||
        key==="arrowup" ||
        key===" "
    ){
        e.preventDefault();
    }

    if(
        key===" " ||
        key==="w" ||
        key==="arrowup"
    ){
        jump();
    }

    if(key==="e"){
        useItem();
    }

    if(key==="p"){

        if(state==="game")
            state="pause";

        else if(state==="pause")
            state="game";
    }

    if(
        key==="r" &&
        state==="gameover"
    ){
        startGame();
    }
});

addEventListener("keyup",e=>{

    keys[
        e.key.toLowerCase()
    ]=false;
});


/* =========================================================
   MOBILE BUTTONS
   ========================================================= */

function holdButton(element,down,up){

    element.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            down();
        }
    );

    element.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            up();
        }
    );

    element.addEventListener(
        "pointercancel",
        up
    );

    element.addEventListener(
        "pointerleave",
        up
    );
}

holdButton(
    document.getElementById("left"),
    ()=>leftPressed=true,
    ()=>leftPressed=false
);

holdButton(
    document.getElementById("right"),
    ()=>rightPressed=true,
    ()=>rightPressed=false
);

document
.getElementById("jump")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        jump();
    }
);


/* =========================================================
   GRID HELPERS
   ========================================================= */

/*
    Returns the box in a column at
    a particular row.
*/

function getBoxAt(col,row){

    return boxes.find(
        box=>
            box.col===col &&
            box.row===row
    );
}


/*
    Find the highest empty row
    in a column.
*/

function getOpenRow(col){

    for(
        let row=0;
        row<MAX_ROWS;
        row++
    ){

        if(
            !getBoxAt(col,row)
        ){
            return row;
        }
    }

    return -1;
}


/*
    Is this column completely full?
*/

function columnFull(col){

    return getOpenRow(col)===-1;
}


/*
    Pick a random column that
    still has room.
*/

function randomOpenColumn(){

    const available=[];

    for(
        let col=0;
        col<GRID_COLS;
        col++
    ){

        if(
            !columnFull(col)
        ){
            available.push(col);
        }
    }

    if(
        available.length===0
    ){
        return -1;
    }

    return available[
        Math.floor(
            Math.random()*
            available.length
        )
    ];
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

    buildGrid();

    state="game";

    score=0;

    gameTime=0;

    spawnTimer=1.5;

    carTimer=6;

    shake=0;

    boxes=[];

    warnings=[];

    items=[];

    boards=[];

    cars=[];

    particles=[];

    floatingTexts=[];

    player.item=null;

    player.shieldTime=0;

    player.dead=false;

    player.vx=0;

    player.vy=0;

    /*
        Start player on ground.
    */

    player.x=
        GRID_X+
        GRID_COLS*
        GRID_SIZE/2-
        PLAYER_SIZE/2;

    player.y=
        groundY-
        PLAYER_SIZE;

    player.grounded=true;


    /*
        A few starting boxes.

        They are already unpacked so
        the game is immediately playable.
    */

    const startingCols=[
        2,
        4,
        Math.max(0,GRID_COLS-3)
    ];

    for(
        const col of startingCols
    ){

        if(
            col>=GRID_COLS
        )
            continue;

        boxes.push({

            col:col,

            row:0,

            x:cellX(col),

            y:cellY(0),

            w:GRID_SIZE,

            h:GRID_SIZE,

            unpacking:false,

            unpackTimer:0,

            unpacked:true
        });
    }
}


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

    if(
        state!=="game"
    )
        return;

    if(
        player.grounded
    ){

        player.vy=
            -JUMP_POWER;

        player.grounded=false;

        particleBurst(
            player.x+
            player.w/2,

            player.y+
            player.h,

            8
        );
    }
}


/* =========================================================
   BOX WARNING
   ========================================================= */

function createWarning(){

    const col=
        randomOpenColumn();

    if(col===-1)
        return;

    /*
        Don't spawn two warnings
        for the same column.
    */

    if(
        warnings.some(
            w=>w.col===col
        )
    ){
        return;
    }

    warnings.push({

        col:col,

        timer:1.15,

        max:1.15
    });
}


/* =========================================================
   WARNING UPDATE
   ========================================================= */

function updateWarnings(dt){

    for(
        let i=
        warnings.length-1;

        i>=0;

        i--
    ){

        const warning=
            warnings[i];

        warning.timer-=dt;

        if(
            warning.timer<=0
        ){

            /*
                The column may have filled
                while the warning was active.

                Recheck it.
            */

            const row=
                getOpenRow(
                    warning.col
                );

            if(row!==-1){

                createFallingBox(
                    warning.col,
                    row
                );
            }

            warnings.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   CREATE FALLING BOX
   ========================================================= */

function createFallingBox(
    col,
    targetRow
){

    boxes.push({

        col:col,

        row:targetRow,

        x:cellX(col),

        /*
            Start well above the
            actual play area.
        */

        y:
            -GRID_SIZE-

            Math.random()*
            100,

        w:GRID_SIZE,

        h:GRID_SIZE,

        falling:true,

        vy:0,

        unpacking:false,

        unpackTimer:0,

        unpacked:false
    });
}


/* =========================================================
   BOX UPDATE
   ========================================================= */

function updateBoxes(dt){

    for(
        let i=0;

        i<boxes.length;

        i++
    ){

        const box=
            boxes[i];

        if(
            box.falling
        ){

            box.vy+=GRAVITY;

            box.y+=
                box.vy;


            const targetY=
                cellY(
                    box.row
                );


            /*
                It ALWAYS falls toward
                its assigned grid cell.
            */

            if(
                box.y>=targetY
            ){

                box.y=targetY;

                box.vy=0;

                box.falling=false;

                box.unpacking=true;

                box.unpackTimer=5;

                box.unpacked=false;


                /*
                    Crush player if the
                    falling box lands on them.
                */

                if(
                    player.x+
                    player.w>
                    box.x &&

                    player.x<
                    box.x+
                    box.w &&

                    player.y+
                    player.h>
                    box.y+5 &&

                    player.y<
                    box.y+
                    box.h
                ){

                    if(
                        player.shieldTime>0
                    ){

                        player.shieldTime=0;

                        particleBurst(
                            player.x+
                            player.w/2,

                            player.y+
                            player.h/2,

                            20
                        );

                    }else{

                        endGame();

                        return;
                    }
                }


                particleBurst(
                    box.x+
                    box.w/2,

                    box.y+
                    box.h,

                    8
                );
            }
        }

        else if(
            box.unpacking
        ){

            box.unpackTimer-=dt;

            if(
                box.unpackTimer<=0
            ){

                box.unpackTimer=0;

                box.unpacking=false;

                box.unpacked=true;


                floatingText(
                    box.x+
                    box.w/2,

                    box.y,
                    "READY!"
                );


                particleBurst(
                    box.x+
                    box.w/2,

                    box.y+
                    box.h/2,

                    10
                );
            }
        }
    }
}


/* =========================================================
   PLAYER PHYSICS
   ========================================================= */

function updatePlayer(dt){

    const left=
        keys["a"] ||
        keys["arrowleft"] ||
        leftPressed;

    const right=
        keys["d"] ||
        keys["arrowright"] ||
        rightPressed;


    /*
        Movement.
    */

    if(left){

        player.vx=
            -MOVE_SPEED;
    }
    else if(right){

        player.vx=
            MOVE_SPEED;
    }
    else{

        player.vx*=.78;
    }


    player.x+=
        player.vx;


    /*
        Keep player inside
        the grid area.
    */

    const minX=
        GRID_X;

    const maxX=
        GRID_X+
        GRID_COLS*
        GRID_SIZE-
        player.w;


    if(
        player.x<minX
    ){

        player.x=minX;

        player.vx=0;
    }

    if(
        player.x>maxX
    ){

        player.x=maxX;

        player.vx=0;
    }


    /*
        Gravity.
    */

    player.vy+=GRAVITY;

    player.y+=
        player.vy;


    player.grounded=false;


    /*
        Height limit.

        The TOP of the player cannot
        go above the top grid row.
    */

    const ceiling=
        cellY(
            MAX_ROWS-1
        );


    if(
        player.y<ceiling
    ){

        player.y=ceiling;

        if(
            player.vy<0
        ){
            player.vy=0;
        }
    }


    /*
        Ground collision.
    */

    if(
        player.y+
        player.h>=
        groundY
    ){

        player.y=
            groundY-
            player.h;

        player.vy=0;

        player.grounded=true;
    }


    /*
        Box collision.

        Boxes act like solid walls
        and platforms.
    */

    for(
        const box of boxes
    ){

        if(!box.unpacked)
            continue;

        const playerLeft=player.x;
        const playerRight=player.x+player.w;
        const playerTop=player.y;
        const playerBottom=player.y+player.h;

        const boxLeft=box.x;
        const boxRight=box.x+box.w;
        const boxTop=box.y;
        const boxBottom=box.y+box.h;

        const hit=
            playerRight>boxLeft &&
            playerLeft<boxRight &&
            playerBottom>boxTop &&
            playerTop<boxBottom;

        if(!hit)
            continue;

        const overlapLeft=
            playerRight-boxLeft;

        const overlapRight=
            boxRight-playerLeft;

        const overlapTop=
            playerBottom-boxTop;

        const overlapBottom=
            boxBottom-playerTop;

        const minOverlap=
            Math.min(
                overlapLeft,
                overlapRight,
                overlapTop,
                overlapBottom
            );

        /*
            Land on top of the box.
        */
        if(
            minOverlap===overlapTop &&
            player.vy>=0
        ){
            player.y=boxTop-player.h;
            player.vy=0;
            player.grounded=true;
        }

        /*
            Hit the underside of the box.
        */
        else if(
            minOverlap===overlapBottom &&
            player.vy<0
        ){
            player.y=boxBottom;
            player.vy=0;
        }

        /*
            Hit the left side of the box.
        */
        else if(
            minOverlap===overlapLeft
        ){
            player.x=boxLeft-player.w;
            player.vx=0;
        }

        /*
            Hit the right side of the box.
        */
        else if(
            minOverlap===overlapRight
        ){
            player.x=boxRight;
            player.vx=0;
        }
    }


    /*
        Board collision.
    */

    for(
        const board of boards
    ){

        if(
            player.x+
            player.w-
            5>
            board.x &&

            player.x+
            5<
            board.x+
            board.w &&

            player.y+
            player.h>=
            board.y &&

            player.y+
            player.h<=
            board.y+18 &&

            player.vy>=0
        ){

            player.y=
                board.y-
                player.h;

            player.vy=0;

            player.grounded=true;

            break;
        }
    }


    /*
        Car collision.
    */

    for(
        const car of cars
    ){

        if(
            player.x+
            player.w>
            car.x &&

            player.x<
            car.x+
            car.w &&

            player.y+
            player.h>
            car.y &&

            player.y<
            car.y+
            car.h
        ){

            /*
                If the player is clearly
                above the car, they jumped it.
            */

            if(
                player.y+
                player.h<=
                car.y+12
            ){

                score+=50;

                floatingText(
                    player.x+
                    player.w/2,

                    player.y,
                    "+50"
                );

            }else{

                if(
                    player.shieldTime>0
                ){

                    player.shieldTime=0;

                    particleBurst(
                        player.x+
                        player.w/2,

                        player.y+
                        player.h/2,

                        20
                    );

                }else{

                    endGame();

                    return;
                }
            }
        }
    }
}


/* =========================================================
   BREAK BOX
   ========================================================= */

function breakBox(index){

    const box=
        boxes[index];

    if(!box)
        return;

    /*
        Can't break while unpacking.
    */

    if(
        !box.unpacked
    )
        return;


    score+=10;


    /*
        Chance to get an item.
    */

    if(
        Math.random()<.35
    ){

        spawnItem(
            box.x+
            box.w/2,

            box.y+
            box.h/2
        );
    }


    particleBurst(
        box.x+
        box.w/2,

        box.y+
        box.h/2,

        20
    );


    floatingText(
        box.x+
        box.w/2,

        box.y,

        "+10"
    );


    boxes.splice(
        index,
        1
    );
}


/* =========================================================
   CANVAS CLICK
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    e=>{

        const x=e.clientX;
        const y=e.clientY;


        if(
            state==="menu"
        ){

            if(
                x>
                W/2-150 &&

                x<
                W/2+150 &&

                y>
                H*.48 &&

                y<
                H*.48+65
            ){

                startGame();

                return;
            }


            if(
                x>
                W-80 &&
                y<80
            ){

                state="info";

                return;
            }
        }


        if(
            state==="info"
        ){

            state="menu";

            return;
        }


        if(
            state==="pause"
        ){

            if(
                y>
                H*.43 &&
                y<
                H*.43+65
            ){

                state="game";

                return;
            }


            if(
                y>
                H*.43+82 &&
                y<
                H*.43+147
            ){

                state="menu";

                return;
            }
        }


        if(
            state==="gameover"
        ){

            if(
                y>
                H*.57 &&
                y<
                H*.57+65
            ){

                startGame();

                return;
            }


            if(
                y>
                H*.57+82 &&
                y<
                H*.57+147
            ){

                state="menu";

                return;
            }
        }


        if(
            state!=="game"
        )
            return;


        /*
            Pause.
        */

        if(
            x>
            W-75 &&
            y<75
        ){

            state="pause";

            return;
        }


        /*
            Mobile E button.
        */

        if(
            player.item &&
            x>
            W-180 &&
            y>
            H-120
        ){

            useItem();

            return;
        }


        /*
            Convert screen click to
            grid coordinates.
        */

        const col=
            Math.floor(
                (
                    x-
                    GRID_X
                )/
                GRID_SIZE
            );


        if(
            col<0 ||
            col>=GRID_COLS
        )
            return;


        /*
            Find the highest box in
            this column.
        */

        for(
            let i=
            boxes.length-1;

            i>=0;

            i--
        ){

            const box=
                boxes[i];

            if(
                box.col!==col
            )
                continue;

            const by=
                box.y;


            if(
                y>
                by &&
                y<
                by+
                GRID_SIZE
            ){

                if(
                    box.unpacked
                ){

                    breakBox(i);
                }

                return;
            }
        }
    }
);


/* =========================================================
   ITEMS
   ========================================================= */

const ITEM_TYPES=[
    "rocket",
    "bomb",
    "board",
    "shield",
    "bounce"
];


function spawnItem(x,y){

    items.push({

        x:x-15,

        y:y-15,

        w:30,

        h:30,

        vy:-5,

        type:
            ITEM_TYPES[
                Math.floor(
                    Math.random()*
                    ITEM_TYPES.length
                )
            ],

        life:20
    });
}


function updateItems(dt){

    for(
        let i=
        items.length-1;

        i>=0;

        i--
    ){

        const item=
            items[i];


        item.vy+=.25;

        item.y+=
            item.vy;


        if(
            item.y+
            item.h>=
            groundY
        ){

            item.y=
                groundY-
                item.h;

            item.vy=0;
        }


        /*
            Pickup.
        */

        if(
            player.x+
            player.w>
            item.x &&

            player.x<
            item.x+
            item.w &&

            player.y+
            player.h>
            item.y &&

            player.y<
            item.y+
            item.h
        ){

            /*
                Don't pick up a second
                item until the current one
                is used.
            */

            if(
                !player.item
            ){

                player.item=
                    item.type;


                floatingText(
                    player.x+
                    player.w/2,

                    player.y,

                    item.type.toUpperCase()
                );


                particleBurst(
                    item.x+
                    item.w/2,

                    item.y+
                    item.h/2,

                    12
                );


                items.splice(
                    i,
                    1
                );

                continue;
            }
        }


        item.life-=dt;


        if(
            item.life<=0
        ){

            items.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   USE ITEM
   ========================================================= */

function useItem(){

    if(
        state!=="game" ||
        !player.item
    )
        return;


    const type=
        player.item;

    player.item=null;


    /*
        ROCKET
    */

    if(
        type==="rocket"
    ){

        const centerCol=
            Math.floor(
                (
                    player.x+
                    player.w/2-
                    GRID_X
                )/
                GRID_SIZE
            );


        let destroyed=0;


        for(
            let i=
            boxes.length-1;

            i>=0;

            i--
        ){

            const box=
                boxes[i];


            if(
                !box.unpacked
            )
                continue;


            if(
                Math.abs(
                    box.col-
                    centerCol
                )<=2
            ){

                breakBox(i);

                destroyed++;

                if(
                    destroyed>=5
                )
                    break;
            }
        }


        particleBurst(
            player.x+
            player.w/2,

            player.y+
            player.h/2,

            25
        );


        shake=8;
    }


    /*
        BOMB
    */

    else if(
        type==="bomb"
    ){

        const px=
            player.x+
            player.w/2;

        const py=
            player.y+
            player.h/2;


        for(
            let i=
            boxes.length-1;

            i>=0;

            i--
        ){

            const box=
                boxes[i];


            if(
                !box.unpacked
            )
                continue;


            const distance=
                Math.hypot(

                    box.x+
                    box.w/2-
                    px,

                    box.y+
                    box.h/2-
                    py
                );


            if(
                distance<150
            ){

                breakBox(i);
            }
        }


        particleBurst(
            px,
            py,
            35
        );


        shake=12;
    }


    /*
        BOARD
    */

    else if(
        type==="board"
    ){

        let y=
            player.y+
            player.h+
            4;


        const top=
            cellY(
                MAX_ROWS-1
            );


        y=
            Math.max(
                y,
                top
            );


        boards.push({

            x:
                player.x+
                player.w/2-
                65,

            y:y,

            w:130,

            h:12,

            life:20
        });
    }


    /*
        SHIELD
    */

    else if(
        type==="shield"
    ){

        player.shieldTime=8;
    }


    /*
        BOUNCE
    */

    else if(
        type==="bounce"
    ){

        player.vy=-19;

        player.grounded=false;


        particleBurst(
            player.x+
            player.w/2,

            player.y+
            player.h,

            20
        );
    }
}


/* =========================================================
   BOARDS
   ========================================================= */

function updateBoards(dt){

    for(
        let i=
        boards.length-1;

        i>=0;

        i--
    ){

        boards[i].life-=dt;


        if(
            boards[i].life<=0
        ){

            boards.splice(
                i,
                1
            );
        }
    }
}

function updateCars(dt){

        cars.length-1;

        i>=0;

        i--

        car.x+=

/* =========================================================
   PARTICLES
   ========================================================= */

function particleBurst(
    x,
    y,
    count
){

    for(
        let i=0;

        i<count;

        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*7,

            vy:
                (Math.random()-.5)*7,

            size:
                3+
                Math.random()*4,

            life:
                .35+
                Math.random()*.5
        });
    }
}

function updateParticles(dt){

    for(
        let i=
        particles.length-1;

        i>=0;

        i--
    ){

        const p=
            particles[i];


        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.2;

        p.life-=dt;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================

function floatingText(
    x,
    y,
    value
){

    floatingTexts.push({

        x:x,

        y:y,

        value:value,

        life:1
    });
}

function updateFloatingTexts(dt){

    for(
        let i=
        floatingTexts.length-1;

        i>=0;

        i--
    ){

        const t=
            floatingTexts[i];


        t.y-=35*dt;

        t.life-=dt;


        if(
            t.life<=0
        ){

            floatingTexts.splice(
                i,
                1
            );
        }
    }
}

/* =========================================================
   GRID
   ========================================================= */

function drawGrid(){

    /*
        Only show the actual playable
        grid area.
    */

    const top=
        cellY(
            MAX_ROWS-1
        );


    /*
        Grid background.
    */

    ctx.fillStyle=
        "rgba(255,255,255,.05)";


    ctx.fillRect(
        GRID_X,
        top,
        GRID_COLS*
        GRID_SIZE,

        groundY-
        top
    );


    /*
        Vertical grid lines.
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.13)";

    ctx.lineWidth=1;


    for(
        let col=0;

        col<=GRID_COLS;

        col++
    ){

        ctx.beginPath();

        ctx.moveTo(
            GRID_X+
            col*
            GRID_SIZE,

            top
        );

        ctx.lineTo(
            GRID_X+
            col*
            GRID_SIZE,

            groundY
        );

        ctx.stroke();
    }


    /*
        Horizontal grid lines.
    */

    for(
        let row=0;

        row<=MAX_ROWS;

        row++
    ){

        const y=
            groundY-
            row*
            GRID_SIZE;


        ctx.beginPath();

        ctx.moveTo(
            GRID_X,
            y
        );

        ctx.lineTo(
            GRID_X+
            GRID_COLS*
            GRID_SIZE,
            y
        );

        ctx.stroke();
    }


    /*
        Height limit.
    */

    ctx.fillStyle=
        "rgba(25,30,36,.95)";


    ctx.fillRect(
        GRID_X,
        top-10,
        GRID_COLS*
        GRID_SIZE,
        10
    );


    ctx.strokeStyle="#f0c44d";

    ctx.lineWidth=3;

    ctx.setLineDash(
        [10,7]
    );


    ctx.beginPath();

    ctx.moveTo(
        GRID_X,
        top
    );

    ctx.lineTo(
        GRID_X+
        GRID_COLS*
        GRID_SIZE,
        top
    );

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.fillStyle="#f0c44d";

    ctx.font=
        "900 10px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "HEIGHT LIMIT",
        W/2,
        top-17
    );
}

function drawBox(box){

    ctx.fillRect(

    ctx.lineWidth=3;


    ctx.strokeRect(
        x,
        y,
        GRID_SIZE,
        GRID_SIZE
    );


    /*
        Tape.
    */

    ctx.fillStyle="#dfbd78";


    ctx.fillRect(
        x+21,
        y,

        GRID_SIZE

        Label.

    ctx.fillStyle="#f0dfba";


    ctx.fillRect(
        x+7,

            GRID_SIZE,

        ctx.font=

        ctx.fillText(

        ctx.fillStyle="#f0c44d";


        ctx.fillRect(
            x+5,
            y+

    /*

    if(
        box.unpacked
    ){

        ctx.fillStyle="#6ed08b";


        ctx.fillRect(
            x+
            GRID_SIZE-
            11,
            y+4,
            7,
            7

        "600 11px Arial";


    ctx.fillText(
        "A / D OR ARROWS • SPACE TO JUMP • E TO USE",
        W/2,
        H*.81
    );


    /*
        Info.
    */

    ctx.fillStyle="#1c242d";


    ctx.beginPath();

    ctx.arc(
        W-43,
        43,
        27,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.font=
        "900 20px Arial";


    ctx.fillText(
        "i",
        W-43,
        50
    );
}


/* =========================================================
   BUTTON
   ========================================================= */

function button(
    label,
    y,
    color
){

    ctx.fillStyle="#171e26";


    ctx.fillRect(
        W/2-150,
        y+6,
        300,
        65
    );


    ctx.fillStyle=color;


    ctx.fillRect(
        W/2-150,
        y,
        300,
        65
    );


    ctx.fillStyle=
        color==="#ffd052"
        ?"#33250d"
        :"#fff";


    ctx.font=
        "900 19px Arial";

    ctx.textAlign="center";


    ctx.fillText(
        label,
        W/2,
        y+40
    );
}


/* =========================================================
   PAUSE
   ========================================================= */

function drawPause(){

    drawGame();


    ctx.fillStyle=
        "rgba(5,8,12,.7)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "900 44px Arial";

    ctx.textAlign="center";


    ctx.fillText(
        "PAUSED",
        W/2,
        H*.34
    );


    button(
        "RESUME",
        H*.43,
        "#ffd052"
    );


    button(
        "HOME",
        H*.43+82,
        "#343e48"
    );
}


/* =========================================================
   GAME OVER
   ========================================================= */

function drawGameOver(){

    drawGame();


    ctx.fillStyle=
        "rgba(5,8,12,.72)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.textAlign="center";


    ctx.fillStyle="#ff665b";

    ctx.font=
        "900 43px Arial";


    ctx.fillText(
        "GAME OVER",
        W/2,
        H*.30
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "900 50px Arial";


    ctx.fillText(
        Math.floor(score)
        .toLocaleString(),

        W/2,
        H*.41
    );


    ctx.fillStyle="#aeb9c4";

    ctx.font=
        "700 11px Arial";


    ctx.fillText(
        "FINAL SCORE",
        W/2,
        H*.47
    );


    button(
        "PLAY AGAIN",
        H*.57,
        "#ffd052"
    );


    button(
        "HOME",
        H*.57+82,
        "#343e48"
    );
}


/* =========================================================
   INFO
   ========================================================= */

function drawInfo(){

    drawBackground();


    ctx.fillStyle=
        "rgba(7,11,15,.72)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.textAlign="center";


    ctx.fillStyle="#fff";

    ctx.font=
        "900 30px Arial";


    ctx.fillText(
        "BOX BOUNCE",
        W/2,
        65
    );


    const info=[

        "BOXES FALL INTO A GRID.",

        "",

        "Each box gets its own column.",

        "Boxes stack one cell at a time.",

        "",

        "A warning appears before a box falls.",

        "",

        "After landing, a box takes",

        "5 SECONDS to unpack.",

        "",

        "Only READY boxes can be broken.",

        "",

        "A / D or ARROWS = MOVE",

        "SPACE / W / UP = JUMP",

        "E = USE ITEM",

        "",

        "ROCKET = BREAK BOXES",

        "BOMB = CLEAR AN AREA",

        "BOARD = PLATFORM",

        "SHIELD = PROTECTION",

        "BOUNCE = SUPER JUMP",

        "",

        "You cannot pass the HEIGHT LIMIT.",

        "Use the stack to escape the car."
    ];


    let y=105;


    for(
        const line
        of info
    ){

        ctx.fillStyle=
            line===""
            ?"transparent"
            :"#dce5eb";


        ctx.font=
            "600 12px Arial";


        ctx.fillText(
            line,
            W/2,
            y
        );


        y+=21;
    }


    button(
        "BACK",
        H-80,
        "#343e48"
    );
}


/* =========================================================
   DRAW GAME
   ========================================================= */

function drawGame(){

    drawBackground();

    drawGrid();

    drawWarnings();


    /*
        Boards.
    */

    for(
        const board
        of boards
    ){

        drawBoard(board);
    }


    /*
        Boxes.
    */

    for(
        const box
        of boxes
    ){

        drawBox(box);
    }


    /*
        Items.
    */

    for(
        const item
        of items
    ){

        drawItem(item);
    }


    /*
        Cars.
    */

    for(
        const car
        of cars
    ){

        drawCar(car);
    }


    /*
        Player.
    */

    drawPlayer();


    drawParticles();

    drawFloatingTexts();

    drawHUD();
}


/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

    if(
        state!=="game"
    )
        return;


    gameTime+=dt;


    /*
        Box spawn timer.
    */

    spawnTimer-=dt;


    if(
        spawnTimer<=0
    ){

        createWarning();


        spawnTimer=
            Math.max(
                .65,
                1.4-
                gameTime*
                .004
            );
    }


    /*
        Car timer.
    */

    carTimer-=dt;


    if(
        carTimer<=0
    ){

        spawnCar();


        carTimer=
            Math.max(
                3.5,
                7-
                gameTime*
                .012
            );
    }


    updateWarnings(dt);

    updateBoxes(dt);


    if(
        state!=="game"
    )
        return;


    updatePlayer(dt);


    if(
        state!=="game"
    )
        return;


    updateItems(dt);

    updateBoards(dt);

    updateCars(dt);

    updateParticles(dt);

    updateFloatingTexts(dt);


    /*
        Shield timer.
    */

    if(
        player.shieldTime>0
    ){

        player.shieldTime-=dt;

        if(
            player.shieldTime<0
        ){
            player.shieldTime=0;
        }
    }


    /*
        Survival score.
    */

    score+=dt;


    /*
        Camera is intentionally NOT
        used here.

        The grid itself is the fixed
        height-limited play area.
    */


    if(shake>0){

        shake*=.88;

        if(shake<.1)
            shake=0;
    }
}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(){

    if(
        state!=="game"
    )
        return;


    player.dead=true;


    if(
        score>best
    ){

        best=
            Math.floor(score);


        localStorage.setItem(
            "boxBounceBest",
            best
        );
    }


    shake=15;


    particleBurst(
        player.x+
        player.w/2,

        player.y+
        player.h/2,

        30
    );


    state="gameover";
}


/* =========================================================
   MAIN LOOP
   ========================================================= */

let last=
    performance.now();


function loop(now){

    const dt=
        Math.min(
            .033,
            (now-last)/
            1000
        );


    last=now;


    update(dt);


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
        Screen shake.
    */

    if(
        shake>0 &&
        state!=="menu"
    ){

        ctx.save();

        ctx.translate(
            (Math.random()-.5)*
            shake,

            (Math.random()-.5)*
            shake
        );
    }


    if(
        state==="menu"
    ){

        drawMenu();
    }

    else if(
        state==="game"
    ){

        drawGame();
    }

    else if(
        state==="pause"
    ){

        drawPause();
    }

    else if(
        state==="gameover"
    ){

        drawGameOver();
    }

    else if(
        state==="info"
    ){

        drawInfo();
    }


    if(
        shake>0 &&
        state!=="menu"
    ){

        ctx.restore();
    }


    requestAnimationFrame(
        loop
    );
}


resize();

requestAnimationFrame(
    loop
);

</script>

</script>
